planning:
  activityType: planning
  enabled: true
  handler: writer
  prompt:
    system: Analyze the assigned subject and create linked planning content.
  branchPolicy:
    kind: main-planning-content
    base: main
  permissions:
    content:
      objective:
        operations: [describe, query, read]
      question:
        operations: [describe, query, read, create, link, validate, commit]
      proposal:
        operations: [describe, query, read, create, link, validate, commit]
      note:
        operations: [describe, query, read, create, link, validate, commit]
    commit:
      allowed: true
  tools:
    allowed: [treedx.context.build, treedx.content.create]
    denied: []
  outputs:
    messageTypes: []
    modelMutations: [question, proposal, note]
  execution:
    maxRuntimeSeconds: 900
    maxRetries: 1
    verificationRequired: false
