id: "@treeseed/sdk"
name: TreeSeed SDK
kind: node-typescript
type: node-library
repository: treeseed-ai/sdk
publishTarget: npm
capabilities: { save: true, verify: true, publish: true, deploy: false, localOnly: false }
workflowTemplateVersion: "1"
githubEnvironments:
  - production
requiredSecrets:
  - NPM_TOKEN
verify:
  fast: npm run verify
  local: npm run verify:local
  release: npm run release:verify
artifacts:
  - provider: npm
    name: "@treeseed/sdk"
releaseGate:
  workflow: verify.yml
standards:
  schemaVersion: 1
  workflow:
    enabled: true
  produced:
    - id: "@treeseed/sdk/typescript-public-api"
      family: typescript
      version: "1.0.0"
      semanticRange: "^1.0.0"
      source: dist
      artifact: .treeseed/standards/typescript-public-api.json
      verifier: scripts/standards/compare-compatibility.ts
    - id: "@treeseed/sdk/openapi"
      family: openapi
      version: "1.0.0"
      semanticRange: "^1.0.0"
      source: docs/api/openapi.json
      artifact: .treeseed/standards/openapi.json
      verifier: scripts/standards/compare-compatibility.ts
  consumed: []
  guarantees:
    - deterministic-contract-bundle
    - exact-artifact-and-source-binding
    - semantic-version-sufficiency
  deprecations: []
  runtimes:
    - node>=22
  rollbackOperations:
    - remove-prerelease-dist-tag
    - restore-accepted-composition
projectArchitecture:
  topology: split_site_content
  rootPath: .
  sitePath: docs
  contentPath: src/content
  contentRuntimeSource: r2_preview_overlay
  localContentMaterialization: none
  contentPublishTarget:
    kind: cloudflare_r2
    prefix: packages/sdk
