name: Promote TreeSeed SDK Candidate

on:
  push:
    tags: ["*.*.*"]

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Require the exact protected staging candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/staging)"
          run_id="$(gh run list --workflow verify.yml --branch staging --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          gh run download "$run_id" --name "sdk-candidate-${GITHUB_SHA}" --dir candidate
          mkdir -p .treeseed/standards
          cp -a candidate/.treeseed/standards/. .treeseed/standards/
      - name: Install publication tooling without lifecycle builds
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run release:check-tag
      - name: Verify sealed custody without building
        run: npm run release:verify-custody
      - name: Publish accepted tarball directly
        run: npm run release:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm run release:readback
      - name: Publish unchanged custody assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" candidate/.treeseed/standards/package/*.tgz \
            candidate/.treeseed/standards/sbom.cdx.json \
            candidate/.treeseed/standards/contract-bundle.json \
            candidate/.treeseed/standards/compatibility-attestation.json \
            candidate/.treeseed/standards/release-evidence-v1.json \
            --generate-notes --verify-tag "${release_flags[@]}"
