name: Content

on:
  push:
    paths:
      - 'docs/src/content/**'
  pull_request:
    paths:
      - 'docs/src/content/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'preview' || (github.ref_name == 'main' && 'production' || (github.ref_name == 'staging' && 'staging' || 'preview')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install package closure
        run: npm ci --ignore-scripts

      - name: Build content publisher
        run: npm run build:dist

      - name: Validate and publish exact content commit
        env:
          TREESEED_TEAM_ID: treeseed
          TREESEED_PROJECT_ID: sdk
          TREESEED_CLOUDFLARE_ACCOUNT_ID: ${{ vars.TREESEED_CLOUDFLARE_ACCOUNT_ID }}
          TREESEED_CONTENT_BUCKET_NAME: ${{ vars.TREESEED_CONTENT_BUCKET_NAME }}
          TREESEED_R2_ACCESS_KEY_ID: ${{ secrets.TREESEED_R2_ACCESS_KEY_ID }}
          TREESEED_R2_SECRET_ACCESS_KEY: ${{ secrets.TREESEED_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          test "${SOURCE_COMMIT}" = "${{ github.event.pull_request.head.sha || github.sha }}"
          CHANNEL=preview
          if test "${GITHUB_REF_NAME}" = main; then CHANNEL=production; fi
          if test "${GITHUB_REF_NAME}" = staging; then CHANNEL=staging; fi
          VALIDATE=()
          if test "${{ github.event_name }}" = pull_request; then VALIDATE+=(--validate-only); fi
          if test "${{ github.event_name }}" != pull_request; then
            node ./dist/scripts/content/publish-content.js --acceptance --team-id "${TREESEED_TEAM_ID}" > r2-acceptance-receipt.json
          fi
          node ./dist/scripts/content/publish-content.js \
            --root . \
            --content-path docs/src/content \
            --source-commit "${SOURCE_COMMIT}" \
            --ref "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" \
            --channel "${CHANNEL}" \
            "${VALIDATE[@]}" > content-publication-receipt.json

      - name: Upload publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: content-publication-${{ github.sha }}
          path: content-publication-receipt.json
