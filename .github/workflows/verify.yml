name: Verify

# Feature branches verify through pull requests; protected branches reverify merged heads.
on:
  push:
    branches: [staging, main]
    paths-ignore: ["docs/src/content/**"]
  pull_request:
    paths-ignore: ["docs/src/content/**"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      TREESEED_STAGE_WAIT_MODE: skip
      TREESEED_AGENT_DISABLE_GIT: "true"
      TREESEED_FIXTURE_ID: treeseed-working-site
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        timeout-minutes: 20
        run: npm ci --no-audit --no-fund

      - name: Verify package
        run: npm run verify:direct

      - name: Pack verified artifact
        run: mkdir -p artifacts && npm pack --json --ignore-scripts --pack-destination artifacts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error
